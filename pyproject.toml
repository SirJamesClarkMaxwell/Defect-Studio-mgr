[project]
name = "defect-studio"
version = "0.1.0"
description = "Defect Studio scientific desktop tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "ipython>=8.0",
]
scientific-core = [
    "numpy>=2.0",
    "scipy>=1.14",
    "ase>=3.22",
    "puntukas[symmetry]",
    "groupy-symmetry",
    "dephonopy",
    "pymatgen>=2025.1",
    "spglib>=2.0",
    "seekpath>=2.1",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "symengine>=0.11",
    "pymatgen-analysis-defects==2026.3.20"  # FNV engine, pinned: validated vs sxdefectalign,
]
scientific-extended = [
    "phonopy>=2.0",
    "phono3py>=3.0",
    "sumo>=2.3",
    "doped>=3.0",
    "mp-api>=0.45",
    "h5py>=3.11",
    "networkx>=3.3",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.uv.sources]
# Private bitbucket.org/puntukas checkouts: cloned into Vendor/, gitignored, never committed.
puntukas = { path = "Vendor/puntukas_tools2", editable = true }
groupy-symmetry = { path = "Vendor/groupy", editable = true }
dephonopy = { path = "Vendor/dephonopy", editable = true }
