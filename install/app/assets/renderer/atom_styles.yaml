#
# Atom style colors:
# - format: color: [R, G, B] where each channel is in range <0.0, 1.0>
# - quick examples:
#   pure red    = [1.00, 0.00, 0.00]
#   pure green  = [0.00, 1.00, 0.00]
#   pure blue   = [0.00, 0.00, 1.00]
#   white       = [1.00, 1.00, 1.00]
#   dark gray   = [0.20, 0.20, 0.20]
# - display_radius controls visible sphere size in renderer units
#
