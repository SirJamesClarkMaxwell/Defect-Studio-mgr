# Defect Studio keybindings.
# System bindings are registered by CoreLayer at startup. This file documents
# the current defaults and is also the place for future user-defined bindings.
bindings:
  - id: "system.undo"
    chord: "Ctrl+Z"
    command: "edit.undo"
    context: ""
    layer: 0
    enabled: true
  - id: "system.redo"
    chord: "Ctrl+Y"
    command: "edit.redo"
    context: ""
    layer: 0
    enabled: true
  - id: "system.command_palette"
    chord: "Ctrl+Shift+P"
    command: "app.command_palette"
    context: ""
    layer: 0
    enabled: true
  - id: "system.quit"
    chord: "Ctrl+Shift+W"
    command: "app.quit"
    context: ""
    layer: 0
    enabled: true
  - id: "system.save"
    chord: "Ctrl+S"
    command: "project.save"
    context: ""
    layer: 0
    enabled: true
  - id: "renderer.align_axis_a"
    chord: "A"
    command: "renderer.align_axis_a"
    context: "renderer.viewport.focused"
    layer: 2
    enabled: true
  - id: "renderer.align_axis_b"
    chord: "B"
    command: "renderer.align_axis_b"
    context: "renderer.viewport.focused"
    layer: 2
    enabled: true
  - id: "renderer.align_axis_c"
    chord: "C"
    command: "renderer.align_axis_c"
    context: "renderer.viewport.focused"
    layer: 2
    enabled: true
  - id: "renderer.orbit_left"
    chord: "Left"
    command: "renderer.orbit_left"
    context: "renderer.viewport.focused"
    layer: 2
    enabled: true
  - id: "renderer.orbit_right"
    chord: "Right"
    command: "renderer.orbit_right"
    context: "renderer.viewport.focused"
    layer: 2
    enabled: true
  - id: "renderer.orbit_up"
    chord: "Up"
    command: "renderer.orbit_up"
    context: "renderer.viewport.focused"
    layer: 2
    enabled: true
  - id: "renderer.orbit_down"
    chord: "Down"
    command: "renderer.orbit_down"
    context: "renderer.viewport.focused"
    layer: 2
    enabled: true
  - id: "renderer.roll_left"
    chord: "Q"
    command: "renderer.roll_left"
    context: "renderer.viewport.focused"
    layer: 2
    enabled: true
  - id: "renderer.roll_right"
    chord: "E"
    command: "renderer.roll_right"
    context: "renderer.viewport.focused"
    layer: 2
    enabled: true
  - id: "renderer.zoom_in"
    chord: "R"
    command: "renderer.zoom_in"
    context: "renderer.viewport.focused"
    layer: 2
    enabled: true
  - id: "renderer.zoom_out"
    chord: "F"
    command: "renderer.zoom_out"
    context: "renderer.viewport.focused"
    layer: 2
    enabled: true
  - id: "renderer.focus_selected_atom"
    chord: "Period"
    command: "renderer.focus_selected_atom"
    context: "renderer.viewport.focused"
    layer: 2
    enabled: true
  - id: "renderer.undo_view"
    chord: "Ctrl+Alt+Z"
    command: "renderer.undo_view"
    context: "renderer.viewport.focused"
    layer: 2
    enabled: true
  - id: "renderer.redo_view"
    chord: "Ctrl+Alt+Shift+Z"
    command: "renderer.redo_view"
    context: "renderer.viewport.focused"
    layer: 2
    enabled: true
  - id: "renderer.redo_view_alt"
    chord: "Ctrl+Alt+Y"
    command: "renderer.redo_view"
    context: "renderer.viewport.focused"
    layer: 2
    enabled: true
